<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏝️ 五一海岛攻略 · 薄荷岛 vs 巴厘岛</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0e1a; --card: #111827; --border: #1e3a5f;
    --text1: #f0f4ff; --text2: #8899bb;
    --sea: #00b4d8; --palm: #06d6a0; --coral: #ef476f; --sand: #ffd166;
  }
  body { background:var(--bg); color:var(--text1); font-family:'Inter',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .tab-bar { display:flex; justify-content:center; gap:8px; padding:16px 20px 12px; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; }
  .tab-btn { padding:10px 28px; border:2px solid var(--border); border-radius:30px; background:transparent; color:var(--text2); font-size:15px; font-weight:600; cursor:pointer; transition:all .3s; font-family:inherit; display:flex; align-items:center; gap:8px; }
  .tab-btn:hover { border-color:var(--sea); color:var(--text1); }
  .tab-btn.active-bohol { background:linear-gradient(135deg, #00b4d8, #06d6a0); border-color:transparent; color:#fff; box-shadow:0 4px 20px rgba(0,180,216,.4); }
  .tab-btn.active-bali { background:linear-gradient(135deg, #ef476f, #ffd166); border-color:transparent; color:#fff; box-shadow:0 4px 20px rgba(239,71,111,.4); }
  .tab-btn .emoji { font-size:20px; }
  .tab-btn .badge { font-size:10px; padding:2px 6px; border-radius:8px; background:rgba(255,255,255,.2); }
  .frame-wrap { flex:1; position:relative; }
  .frame-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:none; }
  .frame-wrap iframe.active { display:block; }
  @media(max-width:600px) {
    .tab-btn { padding:8px 18px; font-size:13px; }
    .tab-btn .badge { display:none; }
  }
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active-bohol" id="btn-bohol" onclick="switchTab('bohol')">
    <span class="emoji">🇵🇭</span> 薄荷岛 <span class="badge">✅ 已确定</span>
  </button>
  <button class="tab-btn" id="btn-bali" onclick="switchTab('bali')">
    <span class="emoji">🇮🇩</span> 巴厘岛 <span class="badge">备选方案</span>
  </button>
</div>
<div class="frame-wrap">
  <iframe id="frame-bohol" class="active" src="薄荷岛攻略.html"></iframe>
  <iframe id="frame-bali" src="巴厘岛攻略.html"></iframe>
</div>
<script>
function switchTab(tab) {
  document.getElementById('frame-bohol').classList.toggle('active', tab==='bohol');
  document.getElementById('frame-bali').classList.toggle('active', tab==='bali');
  const btnB = document.getElementById('btn-bohol');
  const btnL = document.getElementById('btn-bali');
  btnB.className = tab==='bohol' ? 'tab-btn active-bohol' : 'tab-btn';
  btnL.className = tab==='bali' ? 'tab-btn active-bali' : 'tab-btn';
}
</script>
</body>
</html>
