<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knot · 知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a2420;
    --mute: #5e6e66;
    --paper: #efe8dc;
    --sand: #e4d9c8;
    --sea: #2a6b5a;
    --ember: #c45a2c;
    --line: rgba(26,36,32,0.12);
    --panel: #f7f1e7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Source Sans 3", "PingFang SC", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: rgba(239,232,220,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-logo {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em;
    text-decoration: none; color: var(--ink); white-space: nowrap;
  }
  .topbar-logo em { font-style: italic; color: var(--ember); }
  .topbar-search {
    flex: 1; max-width: 420px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 2px;
    background: var(--panel); font-size: 0.92rem; outline: none; color: var(--ink);
  }
  .topbar-search:focus { border-color: var(--sea); }
  .home-link {
    margin-left: auto; font-size: 0.85rem; color: var(--sea); text-decoration: none; font-weight: 500;
  }

  .mobile-cats {
    display: none; gap: 8px; overflow-x: auto; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .mobile-cat-btn {
    flex: 0 0 auto; padding: 7px 12px; border: 1px solid var(--line); background: var(--paper);
    border-radius: 999px; font-size: 0.82rem; color: var(--mute); cursor: pointer;
  }
  .mobile-cat-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .stats-bar {
    display: flex; flex-wrap: wrap; gap: 14px 20px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); font-size: 0.82rem; color: var(--mute);
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
  .stat-val { color: var(--ink); font-weight: 600; }

  .layout { display: flex; min-height: calc(100vh - 120px); }
  .sidebar {
    width: 200px; flex-shrink: 0; padding: 20px 12px;
    border-right: 1px solid var(--line); position: sticky; top: 57px;
    height: calc(100vh - 57px); overflow: auto;
  }
  .sidebar-title {
    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); padding: 0 10px; margin-bottom: 8px; font-weight: 600;
  }
  .cat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 10px; border: none; background: transparent; border-radius: 2px;
    color: var(--mute); font-size: 0.9rem; cursor: pointer; text-align: left;
  }
  .cat-btn:hover { background: var(--sand); color: var(--ink); }
  .cat-btn.active { background: var(--ink); color: var(--paper); }
  .cat-count { margin-left: auto; font-size: 0.75rem; opacity: 0.7; }

  .main { flex: 1; padding: 24px 20px 64px; min-width: 0; }
  .section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .section-title { font-family: "Fraunces", Georgia, serif; font-size: 1.55rem; font-weight: 550; }
  .section-count { color: var(--mute); font-size: 0.9rem; }

  .cards-grid { display: flex; flex-direction: column; gap: 10px; }
  .card {
    position: relative; display: block; padding: 18px 18px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .card:hover { border-color: var(--sea); background: #fffaf2; }
  .card-top { display: flex; gap: 14px; align-items: flex-start; }
  .card-icon {
    width: 40px; height: 40px; border-radius: 2px; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }
  .card-title { font-weight: 600; font-size: 1rem; line-height: 1.35; margin-bottom: 4px; }
  .card-desc { color: var(--mute); font-size: 0.9rem; line-height: 1.45; }
  .card-footer { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-left: 54px; }
  .card-tag { font-size: 0.72rem; padding: 3px 8px; border-radius: 2px; font-weight: 600; }
  .card-date { font-size: 0.78rem; color: var(--mute); margin-left: auto; }
  .card-arrow { position: absolute; right: 16px; top: 18px; color: var(--mute); font-size: 1rem; }

  .empty { text-align: center; padding: 64px 16px; color: var(--mute); }
  .empty-icon { font-size: 1.5rem; margin-bottom: 8px; }

  .overlay {
    position: fixed; inset: 0; z-index: 150; background: rgba(18,28,24,0.55);
    display: none; flex-direction: column;
  }
  .overlay.open { display: flex; }
  .preview-bar {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .preview-title { flex: 1; font-weight: 600; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-close {
    border: 1px solid var(--line); background: var(--panel); width: 36px; height: 36px;
    border-radius: 2px; cursor: pointer; font-size: 1rem;
  }
  .preview-iframe { flex: 1; width: 100%; border: 0; background: #fff; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .mobile-cats { display: flex; }
    .card-footer { padding-left: 0; }
    .home-link { display: none; }
  }
</style>

// ══════════════════════════════════════════════
//  渲染逻辑
// ══════════════════════════════════════════════
let currentCat = 'all';
let searchQuery = '';

function getCatInfo(catId) {
  return CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
}

function getColorScheme(catId) {
  return CAT_COLORS[catId] || { bg: 'rgba(42,107,90,0.12)', color: '#2a6b5a', tag_bg: 'rgba(42,107,90,0.15)', tag_color: '#2a6b5a' };
}

function countByCategory(catId) {
  if (catId === 'all') return ITEMS.length;
  return ITEMS.filter(i => i.category === catId).length;
}

function getFilteredItems() {
  return ITEMS.filter(item => {
    const matchCat = currentCat === 'all' || item.category === currentCat;
    const q = searchQuery.trim().toLowerCase();
    const matchSearch = !q || item.title.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function renderSidebar() {
  const container = document.getElementById('sidebarCats');
  const mobileContainer = document.getElementById('mobileCats');
  container.innerHTML = '';
  mobileContainer.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const count = countByCategory(cat.id);
    const isActive = currentCat === cat.id;

    // Desktop
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (isActive ? ' active' : '');
    btn.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.label}<span class="cat-count">${count}</span>`;
    btn.onclick = () => selectCategory(cat.id);
    container.appendChild(btn);

    // Mobile
    const mbtn = document.createElement('button');
    mbtn.className = 'mobile-cat-btn' + (isActive ? ' active' : '');
    mbtn.textContent = cat.icon + ' ' + cat.label;
    mbtn.onclick = () => selectCategory(cat.id);
    mobileContainer.appendChild(mbtn);
  });
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  const cats = CATEGORIES.filter(c => c.id !== 'all');
  cats.forEach(cat => {
    const count = countByCategory(cat.id);
    if (count === 0) return;
    const cs = getColorScheme(cat.id);
    const item = document.createElement('div');
    item.className = 'stat-item';
    item.innerHTML = `<div class="stat-dot" style="background:${cs.color}"></div><span class="stat-label">${cat.label}</span><span class="stat-val">${count}</span>`;
    bar.appendChild(item);
  });
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');
  const sectionTitle = document.getElementById('sectionTitle');
  const sectionCount = document.getElementById('sectionCount');

  const items = getFilteredItems();
  const catInfo = getCatInfo(currentCat);

  sectionTitle.textContent = catInfo.label === '全部' ? '全部内容' : catInfo.label;
  sectionCount.textContent = items.length + ' 篇';

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = items.map(item => {
    const cs = getColorScheme(item.category);
    const catName = getCatInfo(item.category).label;
    return `
      <div class="card" style="--card-color:${cs.color}" onclick="openPreview('${item.file}','${item.title.replace(/'/g,"\\'")}')">
        <div class="card-top">
          <div class="card-icon" style="background:${cs.bg}">${item.icon}</div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc || ''}</div>
          </div>
        </div>
        <div class="card-footer">
          <span class="card-tag" style="background:${cs.tag_bg};color:${cs.tag_color}">${catName}</span>
          <span class="card-date">${item.date}</span>
        </div>
        <span class="card-arrow">→</span>
      </div>
    `;
  }).join('');
}

function selectCategory(catId) {
  currentCat = catId;
  renderSidebar();
  renderCards();
}

function openPreview(file, title) {
  const overlay = document.getElementById('overlay');
  const frame = document.getElementById('previewFrame');
  const previewTitle = document.getElementById('previewTitle');
  previewTitle.textContent = title;
  frame.src = file;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  const overlay = document.getElementById('overlay');
  const frame = document.getElementById('previewFrame');
  overlay.classList.remove('open');
  frame.src = '';
  document.body.style.overflow = '';
}

// 搜索
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderCards();
});

// 关闭预览
document.getElementById('previewClose').onclick = closePreview;
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});

// 初始化
renderSidebar();
renderStats();
renderCards();

</script>
</body>
</html>
