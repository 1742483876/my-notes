<html lang="zh-CN">

<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #1e1e2e;
    --text: #e2e2e8;
    --muted: #5a5a72;
    --accent: #7c6af7;
    --accent-soft: #1e1a3a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --blue: #60a5fa;
    --red: #f87171;
    --orange: #fb923c;
    --pink: #f472b6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;

    top: 0;
    z-index: 100;

    -webkit-backdrop-filter: blur(12px);

    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;

  .topbar-logo {

    font-weight: 800;
    background: linear-gradient(135deg, #7c6af7, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

  .topbar-search {
    flex: 1;
    background: var(--surface2);

    padding: 8px 14px 8px 36px;
    color: var(--text);

// ══════════════════════════════════════════════
//  密码验证逻辑（localStorage 30天有效）
// ══════════════════════════════════════════════
(function() {
  const AUTH_KEY = 'knot_auth';
  const VALID_DAYS = 30;
  const PWD_HASH = '2ca744'; // 简单hash标识，非明文存储

  function hashPwd(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h).toString(16).slice(0, 6);
  }

  function checkAuth() {
    try {
      const raw = localStorage.getItem(AUTH_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data.hash !== PWD_HASH) return false;
      const elapsed = Date.now() - data.ts;
      return elapsed < VALID_DAYS * 24 * 60 * 60 * 1000;
    } catch { return false; }
  }

  function unlock() {
    localStorage.setItem(AUTH_KEY, JSON.stringify({ hash: PWD_HASH, ts: Date.now() }));
    document.getElementById('lockScreen').classList.add('hidden');
  }

  // 页面加载时检查
  if (checkAuth()) {
    document.getElementById('lockScreen').classList.add('hidden');
  }

  // 暴露验证函数
  window.verifyPassword = function() {
    const input = document.getElementById('lockInput');
    const error = document.getElementById('lockError');
    const pwd = input.value.trim();
    if (!pwd) { error.textContent = '请输入密码'; return; }
    if (hashPwd(pwd) === PWD_HASH) {
      unlock();
      error.textContent = '';
    } else {
      error.textContent = '密码错误，请重试';
      input.value = '';
      input.focus();
    }
  };

  // 回车提交
  document.getElementById('lockInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.verifyPassword();
  });
})();

function getFilteredItems() {
  return ITEMS.filter(item => {
    const matchCat = currentCat === 'all' || item.category === currentCat;
    const q = searchQuery.trim().toLowerCase();
    const matchSearch = !q || item.title.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

function renderSidebar() {
  const container = document.getElementById('sidebarCats');
  const mobileContainer = document.getElementById('mobileCats');
  container.innerHTML = '';
  mobileContainer.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const count = countByCategory(cat.id);
    const isActive = currentCat === cat.id;

    // Desktop
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (isActive ? ' active' : '');
    btn.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.label}<span class="cat-count">${count}</span>`;
    btn.onclick = () => selectCategory(cat.id);
    container.appendChild(btn);

    // Mobile
    const mbtn = document.createElement('button');
    mbtn.className = 'mobile-cat-btn' + (isActive ? ' active' : '');
    mbtn.textContent = cat.icon + ' ' + cat.label;
    mbtn.onclick = () => selectCategory(cat.id);
    mobileContainer.appendChild(mbtn);
  });
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  const cats = CATEGORIES.filter(c => c.id !== 'all');
  cats.forEach(cat => {
    const count = countByCategory(cat.id);
    if (count === 0) return;
    const cs = getColorScheme(cat.id);
    const item = document.createElement('div');
    item.className = 'stat-item';
    item.innerHTML = `<div class="stat-dot" style="background:${cs.color}"></div><span class="stat-label">${cat.label}</span><span class="stat-val">${count}</span>`;
    bar.appendChild(item);
  });
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');
  const sectionTitle = document.getElementById('sectionTitle');
  const sectionCount = document.getElementById('sectionCount');

  const items = getFilteredItems();
  const catInfo = getCatInfo(currentCat);

  sectionTitle.textContent = catInfo.label === '全部' ? '全部内容' : catInfo.label;
  sectionCount.textContent = items.length + ' 篇';

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = items.map(item => {
    const cs = getColorScheme(item.category);
    const catName = getCatInfo(item.category).label;
    return `
      <div class="card" style="--card-color:${cs.color}" onclick="openPreview('${item.file}','${item.title.replace(/'/g,"\\'")}')">
        <div class="card-top">
          <div class="card-icon" style="background:${cs.bg}">${item.icon}</div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc || ''}</div>
          </div>
        </div>
        <div class="card-footer">
          <span class="card-tag" style="background:${cs.tag_bg};color:${cs.tag_color}">${catName}</span>
          <span class="card-date">${item.date}</span>
        </div>
        <span class="card-arrow">→</span>
      </div>
    `;
  }).join('');
}

function selectCategory(catId) {
  currentCat = catId;
  renderSidebar();
  renderCards();
}

function openPreview(file, title) {
  const overlay = document.getElementById('overlay');
  const frame = document.getElementById('previewFrame');
  const previewTitle = document.getElementById('previewTitle');
  previewTitle.textContent = title;
  frame.src = encodeURIComponent(file);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  const overlay = document.getElementById('overlay');
  const frame = document.getElementById('previewFrame');
  overlay.classList.remove('open');
  frame.src = '';
  document.body.style.overflow = '';
}

// 搜索
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderCards();
});

// 关闭预览
document.getElementById('previewClose').onclick = closePreview;
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closePreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});

// 初始化
renderSidebar();
renderStats();
renderCards();
</script>
</body>
</html>
