<script>

const IanVault = (() => {
  const STORE = 'ian_vault_key_v1';
  const DAYS = 30;
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  async function derive(pwd, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw, p) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.ct));
    return new TextDecoder().decode(pt);
  }
  function load(salt) {
    for (const st of [sessionStorage, localStorage]) {
      try {
        const d = JSON.parse(st.getItem(STORE) || 'null');
        if (d && d.s === salt && (!d.exp || d.exp > Date.now())) return unb64(d.k);
      } catch (e) {}
    }
    return null;
  }
  function save(salt, raw, remember) {
    const k = b64(raw);
    try { sessionStorage.setItem(STORE, JSON.stringify({ s: salt, k })); } catch (e) {}
    try {
      if (remember) localStorage.setItem(STORE, JSON.stringify({ s: salt, k, exp: Date.now() + DAYS * 864e5 }));
      else localStorage.removeItem(STORE);
    } catch (e) {}
  }
  function forget() {
    try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {}
  }
  // 用已保存的 key 尝试解密；失败返回 null
  async function tryStored(p) {
    const raw = load(p.salt);
    if (!raw) return null;
    try { return await decrypt(raw, p); } catch (e) { forget(); return null; }
  }
  // 用密码解密；成功则按 remember 保存派生 key（不保存明文密码）
  async function withPassword(p, pwd, remember) {
    const raw = await derive(pwd, p.salt, p.iter);
    const text = await decrypt(raw, p);
    save(p.salt, raw, remember);
    return text;
  }
  return { tryStored, withPassword, forget };
})();

(async () => {
  const P = JSON.parse(document.getElementById('vault-payload').textContent);
  const ready = () => new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
  const show = async (html) => { await ready(); document.open(); document.write(html); document.close(); };
  const ok = await IanVault.tryStored(P);
  if (ok !== null) return show(ok);
  const box = document.getElementById('box'), f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn'), pwd = document.getElementById('pwd');
  box.classList.remove('hidden'); pwd.focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pwd.value) { err.textContent = '请输入密码'; return; }
    btn.disabled = true; err.textContent = '解密中…';
    try { show(await IanVault.withPassword(P, pwd.value, document.getElementById('rem').checked)); }
    catch (x) { err.textContent = '密码错误'; pwd.value = ''; pwd.focus(); btn.disabled = false; }
  });
})();
</script>
