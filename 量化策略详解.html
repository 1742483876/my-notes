<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>量化策略详解</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;
  --red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657;
  --card-radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:16px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,#58a6ff,#bc8cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:13px;color:var(--text2);margin-top:2px}
.back-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;transition:.2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 导航tabs */
.nav-tabs{display:flex;gap:4px;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.nav-tab{padding:8px 16px;cursor:pointer;font-size:12px;color:var(--text2);border:1px solid var(--border);border-radius:20px;white-space:nowrap;transition:.2s;background:transparent}
.nav-tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.nav-tab:hover:not(.active){color:var(--text);border-color:var(--text2)}
.nav-tab .cat-icon{margin-right:4px}

.container{max-width:1200px;margin:0 auto;padding:24px 32px}

/* 概览区 */
.overview{margin-bottom:32px}
.overview h2{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.overview h2 .emoji{font-size:24px}
.overview-desc{color:var(--text2);font-size:14px;line-height:1.8;margin-bottom:20px;max-width:800px}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;min-width:140px;flex:1}
.mini-stat .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.mini-stat .value{font-size:22px;font-weight:700}
.mini-stat .value.green{color:var(--green)}
.mini-stat .value.red{color:var(--red)}
.mini-stat .value.blue{color:var(--accent)}
.mini-stat .value.purple{color:var(--purple)}
.mini-stat .value.yellow{color:var(--yellow)}

/* 策略分类 */
.category-section{margin-bottom:40px}
.category-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.category-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.category-header h3{font-size:18px;font-weight:600}
.category-header .count{font-size:12px;color:var(--text2);background:var(--surface2);padding:2px 10px;border-radius:12px}

/* 策略卡片 */
.strategy-cards{display:grid;grid-template-columns:1fr;gap:16px}
.strategy-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);overflow:hidden;transition:.2s}
.strategy-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(88,166,255,.1)}
.strategy-card.expanded .card-detail{display:block}
.card-header{padding:18px 20px;cursor:pointer;display:flex;align-items:flex-start;gap:16px}
.card-rank{min-width:48px;height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.card-rank .weight-num{font-size:16px;font-weight:800;line-height:1}
.card-rank .weight-label{font-size:9px;opacity:.8;margin-top:2px}
.card-info{flex:1;min-width:0}
.card-title-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.card-name{font-size:16px;font-weight:600}
.card-id{font-size:11px;color:var(--text2);background:var(--surface2);padding:2px 8px;border-radius:4px;font-family:monospace}
.card-type-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.card-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.card-metrics{display:flex;gap:16px;flex-wrap:wrap}
.metric{display:flex;align-items:center;gap:4px;font-size:12px}
.metric .label{color:var(--text2)}
.metric .val{font-weight:600}
.metric .val.pos{color:var(--green)}
.metric .val.neg{color:var(--red)}
.card-expand-btn{min-width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;margin-top:8px}
.card-expand-btn:hover{border-color:var(--accent);color:var(--accent)}
.strategy-card.expanded .card-expand-btn{transform:rotate(180deg)}

/* 详情展开区 */
.card-detail{display:none;border-top:1px solid var(--border);padding:20px;background:rgba(0,0,0,.15)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr}}
.detail-section{background:var(--surface2);border-radius:10px;padding:16px}
.detail-section h4{font-size:13px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.detail-section h4 .icon{font-size:14px}
.detail-content{font-size:13px;color:var(--text);line-height:1.8}
.detail-content ul{list-style:none;padding:0}
.detail-content ul li{padding:4px 0;padding-left:16px;position:relative}
.detail-content ul li::before{content:'▸';position:absolute;left:0;color:var(--accent)}
.detail-content code{background:rgba(88,166,255,.1);color:var(--accent);padding:1px 6px;border-radius:4px;font-size:12px;font-family:'SF Mono',Consolas,monospace}
.detail-content .formula{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:8px 0;font-family:'SF Mono',Consolas,monospace;font-size:12px;color:var(--purple);white-space:pre-wrap;overflow-x:auto}
.detail-content .tip{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:var(--yellow)}
.detail-content .tip::before{content:'💡 ';font-size:13px}

/* 指标解释区 */
.glossary{margin-top:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:24px}
.glossary h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.glossary-item{background:var(--surface2);border-radius:8px;padding:14px 16px}
.glossary-item .term{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
.glossary-item .def{font-size:12px;color:var(--text2);line-height:1.6}

/* 响应式 */
@media(max-width:768px){
  .container{padding:16px}
  .header{padding:16px}
  .nav-tabs{padding:8px 16px}
  .card-header{flex-direction:column;gap:12px}
  .card-metrics{gap:8px}
  .stat-row{flex-direction:column}
  .glossary-grid{grid-template-columns:1fr}
}

/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}

/* 筛选按钮 */
.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:12px;color:var(--text2);margin-right:4px}
.filter-btn{padding:5px 14px;border:1px solid var(--border);border-radius:16px;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:.2s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn:hover:not(.active){border-color:var(--text2);color:var(--text)}

.loading{display:flex;align-items:center;justify-content:center;padding:80px;flex-direction:column;gap:16px;color:var(--text2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">📊</div>
    <div>
      <h1>量化策略详解手册</h1>
      <div class="header-sub">29个策略 × 详细量化指标 × 触发条件 × 代码逻辑</div>
    </div>
  </div>
  <a class="back-btn" href="量化选股大盘.html">← 返回大盘</a>
</div>

<div class="nav-tabs" id="navTabs"></div>

<div class="container">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>加载策略数据中...</div>
  </div>
  <div id="mainContent" style="display:none">
    <!-- 概览 -->
    <div class="overview" id="overview"></div>
    <!-- 筛选 -->
    <div class="filter-row" id="filterRow"></div>
    <!-- 策略卡片 -->
    <div id="strategyContent"></div>
    <!-- 指标术语解释 -->
    <div class="glossary" id="glossary"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// 策略详细知识库（手动编写，包含每个策略的深度解释）
// ═══════════════════════════════════════════════════════════════════
const STRATEGY_KNOWLEDGE = {
  bollingerMeanReversion: {
    category: 'technical',
    typeTag: '均值回归',
    color: '#58a6ff',
    principle: '布林带（Bollinger Bands）由约翰·布林格发明，由中轨（20日均线）和上下轨（±2倍标准差）组成。当股价跌破下轨时，意味着价格偏离均值超过2个标准差，统计上属于极端低估区域（概率<2.5%），大概率会向均值回归。',
    trigger: [
      '收盘价 < 布林带下轨（20日均线 - 2×标准差）',
      '即：Close < MA20 - 2 × STD20'
    ],
    formula: 'MA20 = SUM(Close, 20) / 20\nSTD20 = √(Σ(Close_i - MA20)² / 20)\n下轨 = MA20 - 2 × STD20\n信号 = Close < 下轨',
    params: [
      { name: '均线周期', value: '20日', desc: '布林带中轨的移动平均窗口' },
      { name: '标准差倍数', value: '2倍', desc: '上下轨距离中轨的标准差倍数' },
      { name: '持仓天数', value: '5天', desc: '信号触发后的默认持仓周期' }
    ],
    strengths: ['统计学原理清晰，回归概率高', '适合震荡市场中的低吸策略', '信号明确，不需要主观判断'],
    weaknesses: ['趋势性下跌中可能连续触发（追跌）', '单边熊市中均值回归可能失效', '需要配合其他指标过滤假信号'],
    tip: '布林回归是本系统权重最高的策略（12.1%），历史胜率59.6%，Sharpe比率2.27，说明其信号质量稳定可靠。建议配合RSI超卖或成交量指标使用。'
  },
  equalWeight: {
    category: 'portfolio',
    typeTag: '组合策略',
    color: '#d29922',
    principle: '等权组合是最简单的资产配置策略，对所有策略赋予相同权重。其核心思想来自诺贝尔奖获得者马科维茨的"分散化投资"理论——不把鸡蛋放在一个篮子里。研究表明，等权组合在长期往往能跑赢大多数主动管理策略。',
    trigger: [
      '每20个交易日（约1个月）检查一次',
      '如果过去20日涨幅 > 0%（市场不在下跌趋势中），触发信号'
    ],
    formula: '每只股票权重 = 1/N（N为持仓股票数）\n再平衡周期 = 20个交易日\n触发条件 = (Close - Close_20d前) / Close_20d前 > 0',
    params: [
      { name: '再平衡周期', value: '20天', desc: '每月调仓一次，恢复等权' },
      { name: '趋势过滤', value: '20日涨幅>0', desc: '只在上涨趋势中建仓' }
    ],
    strengths: ['极度分散化，降低个股风险', '不依赖任何预测模型，最朴素的策略', '长期表现稳健，适合基准对比'],
    weaknesses: ['无法捕捉个股alpha', '在牛市中跑不赢集中持仓策略', '等权意味着小盘股权重偏高'],
    tip: '等权组合在系统中主要作为"基准策略"存在，权重11.7%。它的作用是当其他策略信号不明确时，提供一个安全的默认选择。'
  },
  ahPremiumArb: {
    category: 'value',
    typeTag: '套利策略',
    color: '#3fb950',
    principle: 'AH溢价套利利用同一家公司在A股和H股的价格差异。理论上同一公司的A股和H股应该价格趋同，但由于市场分割、投资者结构不同，经常出现A股溢价。当A股相对H股溢价率低于历史均值时，说明A股相对低估，存在套利空间。',
    trigger: [
      '股价低于20日均线5%以上（超跌低估代理）',
      '成交量 > 20日均量的30%（确保有流动性）',
      '即：Close < MA20 × 0.95 且 Volume > VMA20 × 0.3'
    ],
    formula: '超跌信号 = Close < MA20 × 0.95\n流动性过滤 = Volume > VMA20 × 0.3\n综合信号 = 超跌信号 AND 流动性过滤',
    params: [
      { name: '超跌阈值', value: '-5%', desc: '相对20日均线的偏离度阈值' },
      { name: '流动性阈值', value: '30%均量', desc: '最低成交量要求（避免僵尸股）' }
    ],
    strengths: ['基于价值回归的逻辑，长期有效', '有明确的安全边际（低于均线）', '适合中长期持有'],
    weaknesses: ['真实AH溢价数据不可用，使用代理指标', '收敛时间不确定', '需要关注港股通资金流向'],
    tip: 'AH溢价策略权重11.3%，IC值较高说明其选股能力稳定。但注意本系统使用的是代理指标（超跌+流动性），并非真实AH溢价率。'
  },
  bottomFishing76: {
    category: 'technical',
    typeTag: '抄底策略',
    color: '#f85149',
    principle: '76.4%斐波那契回调位是技术分析中的重要支撑位。斐波那契数列（0, 1, 1, 2, 3, 5, 8, 13...）的相邻比值趋近黄金分割0.618，而0.764 = 1 - 0.236是深度回调位。当价格回调到这个位置并出现止跌信号（下影线+RSI低位），往往是较好的抄底时机。',
    trigger: [
      '5日跌幅 > 4%（短期急跌）',
      'RSI(14) < 35（超卖区域）',
      '下影线长度 ≥ 实体长度（止跌K线形态）'
    ],
    formula: '急跌信号 = (Close - Close_5d前) / Close_5d前 < -4%\nRSI过滤 = RSI(14) < 35\nK线形态 = (min(O,C) - Low) ≥ |Close - Open|\n综合信号 = 急跌 AND RSI超卖 AND 下影线',
    params: [
      { name: '跌幅阈值', value: '-4%/5日', desc: '5日内跌幅超过4%' },
      { name: 'RSI阈值', value: '<35', desc: 'RSI低于35进入超卖区' },
      { name: '下影线比', value: '≥1.0倍', desc: '下影线长度不低于实体' }
    ],
    strengths: ['多重条件过滤，信号质量高', '结合量价形态，不是盲目抄底', '斐波那契回调位有广泛市场共识'],
    weaknesses: ['信号较少，可能错过机会', '在系统性风险中可能失效', '需要精确判断止跌形态'],
    tip: '76抄底策略权重10.9%，胜率66.7%是所有策略中最高的。其三重过滤（急跌+RSI超卖+止跌K线）确保了信号的高质量，但交易次数较少。'
  },
  rsiOversold: {
    category: 'technical',
    typeTag: '超买超卖',
    color: '#bc8cff',
    principle: 'RSI（相对强弱指数）由韦尔斯·怀尔德发明，衡量一段时间内价格涨跌的相对强度。RSI值在0-100之间，低于30为超卖区（过度下跌），高于70为超买区。当RSI从超卖区回升穿越30时，意味着卖压减弱、买盘开始介入，是经典的反弹信号。',
    trigger: [
      '前一日 RSI(14) < 30（处于超卖区）',
      '当日 RSI(14) ≥ 30（从超卖区回升）'
    ],
    formula: 'RSI(14) = 100 - 100/(1 + RS)\nRS = 14日平均涨幅 / 14日平均跌幅\n信号 = RSI_昨日 < 30 AND RSI_今日 ≥ 30',
    params: [
      { name: 'RSI周期', value: '14日', desc: '计算RSI的回看窗口' },
      { name: '超卖阈值', value: '30', desc: 'RSI低于此值视为超卖' },
      { name: '信号类型', value: '金叉30', desc: 'RSI从下方穿越30线' }
    ],
    strengths: ['经典技术指标，市场认可度高', '信号明确，无模糊地带', '适合短线反弹交易'],
    weaknesses: ['强趋势下跌中RSI可能长期低于30', '单一指标信号噪音较大', '不适合趋势跟踪'],
    tip: 'RSI超卖权重9.9%，胜率62.3%，Sharpe 4.66是所有策略中最高的。这说明RSI超卖信号的风险调整后收益非常优秀。'
  },
  permanentPortfolio: {
    category: 'portfolio',
    typeTag: '资产配置',
    color: '#ffa657',
    principle: '永久组合（Permanent Portfolio）由哈里·布朗提出，将资金等分为四份：股票25% + 债券25% + 黄金25% + 现金25%。这四类资产在不同经济周期中表现各异，组合后可以实现"全天候"的稳定收益。本系统中简化为每60个交易日（约一个季度）触发一次再平衡信号。',
    trigger: [
      '每60个交易日自动触发一次',
      '固定周期再平衡，无需其他条件'
    ],
    formula: '信号 = (当前K线索引 % 60 == 0)\n配置比例 = 股票25% + 债券25% + 黄金25% + 现金25%',
    params: [
      { name: '再平衡周期', value: '60天', desc: '约一个季度调仓一次' },
      { name: '各资产权重', value: '各25%', desc: '四类资产等权配置' }
    ],
    strengths: ['极度分散化，穿越牛熊', '不依赖任何预测，纯被动策略', '历史回测波动率极低'],
    weaknesses: ['牛市中收益大幅落后纯股票', '本系统中只能代理股票部分', '再平衡成本不可忽略'],
    tip: '永久组合权重9.0%，作为系统中的"压舱石"策略，在市场波动剧烈时提供稳定性。'
  },
  oversoldBounce: {
    category: 'technical',
    typeTag: '超跌反弹',
    color: '#f85149',
    principle: '超跌反弹策略捕捉短期暴跌后的技术性反弹。当一只股票在10个交易日内跌幅超过8%，市场往往过度反应，随后出现的1.5%以上反弹可能是空头回补或抄底资金介入的信号。',
    trigger: [
      '10日跌幅 > 8%（短期超跌）',

// 加载数据
async function loadData() {
  try {
    const resp = await fetch('data/api/quant_dashboard.json?' + Date.now());
    return await resp.json();
  } catch(e) {
    console.error('加载失败:', e);
    return null;
  }
}

function renderPage(data) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';

  const strategies = data.strategy_list || [];
  const weights = data.weights || {};

  // 概览
  const activeCount = strategies.filter(s => s.weight > 0).length;
  const totalWeight = Object.values(weights).reduce((a,b) => a + Math.max(b,0), 0);
  document.getElementById('overview').innerHTML = `
    <h2><span class="emoji">📖</span> 策略体系概览</h2>
    <div class="overview-desc">
      本量化系统共包含 <strong>${strategies.length}</strong> 个策略，分为技术分析、价值投资、量化因子、资金流向、组合配置五大类。
      每个策略通过 <strong>IC（信息系数）</strong> 计算预测能力，并基于 <strong>ICIR（信息系数比率）</strong> 分配权重。
      当前有 <strong>${activeCount}</strong> 个策略处于活跃状态（权重>0），系统每日自动扫描 <strong>${data.stock_count || 5198}</strong> 只A股。
    </div>
    <div class="stat-row">
      <div class="mini-stat"><div class="label">策略总数</div><div class="value blue">${strategies.length}</div></div>
      <div class="mini-stat"><div class="label">活跃策略</div><div class="value green">${activeCount}</div></div>
      <div class="mini-stat"><div class="label">零权重策略</div><div class="value red">${strategies.length - activeCount}</div></div>
      <div class="mini-stat"><div class="label">扫描股票数</div><div class="value purple">${(data.stock_count||5198).toLocaleString()}</div></div>
      <div class="mini-stat"><div class="label">Alpha因子</div><div class="value yellow">${data.alpha_enabled ? '已启用' : '未启用'}</div></div>
    </div>
  `;

  // 导航tabs
  const tabsHtml = `
    <div class="nav-tab active" data-cat="all"><span class="cat-icon">🏠</span>全部</div>
    ${Object.entries(CATEGORIES).map(([k,v]) => 
      `<div class="nav-tab" data-cat="${k}"><span class="cat-icon">${v.icon}</span>${v.name}</div>`
    ).join('')}
  `;
  document.getElementById('navTabs').innerHTML = tabsHtml;

  // 筛选
  document.getElementById('filterRow').innerHTML = `
    <span class="filter-label">排序：</span>
    <button class="filter-btn active" data-sort="weight">按权重</button>
    <button class="filter-btn" data-sort="winrate">按胜率</button>
    <button class="filter-btn" data-sort="sharpe">按Sharpe</button>
    <button class="filter-btn" data-sort="trades">按交易次数</button>
    <span class="filter-label" style="margin-left:16px">显示：</span>
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="active">仅活跃</button>
    <button class="filter-btn" data-filter="inactive">仅休眠</button>
  `;

  let currentSort = 'weight';
  let currentFilter = 'all';
  let currentCat = 'all';

  function renderStrategies() {
    let list = [...strategies];
    // 分类过滤
    if (currentCat !== 'all') {
      list = list.filter(s => {
        const k = STRATEGY_KNOWLEDGE[s.id];
        return k && k.category === currentCat;
      });
    }
    // 活跃过滤
    if (currentFilter === 'active') list = list.filter(s => s.weight > 0);
    if (currentFilter === 'inactive') list = list.filter(s => s.weight <= 0);
    // 排序
    if (currentSort === 'weight') list.sort((a,b) => b.weight - a.weight);
    else if (currentSort === 'winrate') list.sort((a,b) => (b.backtest_1y?.win_rate||0) - (a.backtest_1y?.win_rate||0));
    else if (currentSort === 'sharpe') list.sort((a,b) => (b.backtest_1y?.sharpe||0) - (a.backtest_1y?.sharpe||0));
    else if (currentSort === 'trades') list.sort((a,b) => (b.backtest_1y?.total_trades||0) - (a.backtest_1y?.total_trades||0));

    // 按分类分组
    const grouped = {};
    list.forEach(s => {
      const k = STRATEGY_KNOWLEDGE[s.id];
      const cat = k ? k.category : 'technical';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(s);
    });

    let html = '';
    const catOrder = currentCat === 'all' ? Object.keys(CATEGORIES) : [currentCat];
    catOrder.forEach(cat => {
      const items = grouped[cat];
      if (!items || !items.length) return;
      const catInfo = CATEGORIES[cat];
      html += `
        <div class="category-section">
          <div class="category-header">
            <div class="category-icon" style="background:${catInfo.color}20;color:${catInfo.color}">${catInfo.icon}</div>
            <h3>${catInfo.name}</h3>
            <span class="count">${items.length} 个策略</span>
          </div>
          <div class="strategy-cards">
            ${items.map(s => renderStrategyCard(s)).join('')}
          </div>
        </div>
      `;
    });

    document.getElementById('strategyContent').innerHTML = html;
    bindCardEvents();
  }

  function renderStrategyCard(s) {
    const k = STRATEGY_KNOWLEDGE[s.id] || {};
    const bt = s.backtest_1y || {};
    const weightPct = (s.weight * 100).toFixed(1);
    const bgColor = s.weight > 0 ? (k.color || '#58a6ff') : '#30363d';

    return `
      <div class="strategy-card" data-id="${s.id}">
        <div class="card-header">
          <div class="card-rank" style="background:${bgColor}">
            <span class="weight-num">${weightPct}%</span>
            <span class="weight-label">权重</span>
          </div>
          <div class="card-info">
            <div class="card-title-row">
              <span class="card-name">${s.name}</span>
              <span class="card-id">${s.id}</span>
              ${k.typeTag ? `<span class="card-type-tag" style="background:${k.color||'#58a6ff'}22;color:${k.color||'#58a6ff'};border:1px solid ${k.color||'#58a6ff'}44">${k.typeTag}</span>` : ''}
            </div>
            <div class="card-desc">${s.desc}</div>
            <div class="card-metrics">
              <div class="metric"><span class="label">胜率</span><span class="val ${bt.win_rate>50?'pos':bt.win_rate>0?'neg':''}">${bt.win_rate||'-'}%</span></div>
              <div class="metric"><span class="label">平均收益</span><span class="val ${(bt.avg_return||0)>0?'pos':'neg'}">${bt.avg_return>0?'+':''}${bt.avg_return||'-'}%</span></div>
              <div class="metric"><span class="label">累计收益</span><span class="val ${(bt.total_return||0)>0?'pos':'neg'}">${bt.total_return>0?'+':''}${bt.total_return||'-'}%</span></div>
              <div class="metric"><span class="label">Sharpe</span><span class="val">${bt.sharpe||'-'}</span></div>
              <div class="metric"><span class="label">最大回撤</span><span class="val neg">${bt.max_drawdown||'-'}%</span></div>
              <div class="metric"><span class="label">交易次数</span><span class="val">${(bt.total_trades||0).toLocaleString()}</span></div>
            </div>
          </div>
          <button class="card-expand-btn" title="展开详情">▼</button>
        </div>
        <div class="card-detail">
          ${renderCardDetail(s, k, bt)}
        </div>
      </div>
    `;
  }

  function renderCardDetail(s, k, bt) {
    if (!k.principle) return '<div style="padding:20px;color:var(--text2)">暂无详细说明</div>';
    return `
      <div class="detail-grid">
        <div class="detail-section">
          <h4><span class="icon">📚</span> 策略原理</h4>
          <div class="detail-content">${k.principle}</div>
        </div>
        <div class="detail-section">
          <h4><span class="icon">⚡</span> 触发条件</h4>
          <div class="detail-content">
            <ul>${(k.trigger||[]).map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="detail-section">
          <h4><span class="icon">🔢</span> 计算公式</h4>
          <div class="detail-content">
            <div class="formula">${k.formula||''}</div>
          </div>
        </div>
        <div class="detail-section">
          <h4><span class="icon">⚙️</span> 关键参数</h4>
          <div class="detail-content">
            <ul>${(k.params||[]).map(p => `<li><code>${p.name}</code> = <strong>${p.value}</strong> — ${p.desc}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="detail-section">
          <h4><span class="icon">✅</span> 优势</h4>
          <div class="detail-content">
            <ul>${(k.strengths||[]).map(s => `<li>${s}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="detail-section">
          <h4><span class="icon">⚠️</span> 风险与局限</h4>
          <div class="detail-content">
            <ul>${(k.weaknesses||[]).map(w => `<li>${w}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
      ${k.tip ? `<div class="detail-content" style="margin-top:16px"><div class="tip">${k.tip}</div></div>` : ''}
    `;
  }

  function bindCardEvents() {
    document.querySelectorAll('.strategy-card').forEach(card => {
      card.querySelector('.card-header').addEventListener('click', () => {
        card.classList.toggle('expanded');
      });
    });
  }

  // 事件绑定
  document.getElementById('navTabs').addEventListener('click', e => {
    const tab = e.target.closest('.nav-tab');
    if (!tab) return;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    renderStrategies();
  });

  document.getElementById('filterRow').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    if (btn.dataset.sort) {
      document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
    }
    if (btn.dataset.filter) {
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
    }
    renderStrategies();
  });

  // 渲染术语表
  document.getElementById('glossary').innerHTML = `
    <h3>📖 量化指标术语解释</h3>
    <div class="glossary-grid">
      <div class="glossary-item">
        <div class="term">权重 (Weight)</div>
        <div class="def">策略在综合评分中的占比。由IC（信息系数）计算得出，IC越高权重越大。正权重策略命中时加分，负权重策略命中时扣分（反向信号）。权重为0表示该策略当前无预测能力。</div>
      </div>
      <div class="glossary-item">
        <div class="term">胜率 (Win Rate)</div>
        <div class="def">策略信号触发后，持仓5天内盈利的交易占总交易的比例。胜率>50%说明策略整体有正收益预期。注意胜率高不代表收益高，需结合平均收益看。</div>
      </div>
      <div class="glossary-item">
        <div class="term">平均收益 (Avg Return)</div>
        <div class="def">所有交易的平均收益率（%）。正值表示策略整体盈利，负值表示亏损。这是衡量策略盈利能力的核心指标。</div>
      </div>
      <div class="glossary-item">
        <div class="term">累计收益 (Total Return)</div>
        <div class="def">所有交易的复利累计收益。计算方式：(1+r₁) × (1+r₂) × ... × (1+rₙ) - 1。反映策略长期的总回报能力。</div>
      </div>
      <div class="glossary-item">
        <div class="term">Sharpe 比率</div>
        <div class="def">风险调整后收益 = 平均收益 / 收益标准差 × √(252/持仓天数)。Sharpe>1算不错，>2算优秀，>3算顶级。它衡量的是每承担一单位风险能获得多少收益。</div>
      </div>
      <div class="glossary-item">
        <div class="term">最大回撤 (Max Drawdown)</div>
        <div class="def">从历史最高点到最低点的最大跌幅。反映策略最坏情况下的亏损程度。回撤越小说明策略越稳健。一般要求最大回撤<30%。</div>
      </div>
      <div class="glossary-item">
        <div class="term">IC (Information Coefficient)</div>
        <div class="def">信息系数，衡量策略信号与未来收益的Spearman相关系数。IC>0说明策略有正向预测能力，IC<0说明是反向指标。|IC|>0.03就算有效因子。</div>
      </div>
      <div class="glossary-item">
        <div class="term">ICIR (IC Information Ratio)</div>
        <div class="def">IC的均值除以IC的标准差，衡量IC的稳定性。ICIR>0.5说明因子稳定有效。本系统用ICIR分配Alpha因子权重，ICIR越高权重越大。</div>
      </div>
      <div class="glossary-item">
        <div class="term">交易次数 (Trade Count)</div>
        <div class="def">回测期间策略信号触发的总次数。次数太少（<30）统计不可靠，次数太多（>100,000）可能信号过于宽松。理想范围：100-10,000次。</div>
      </div>
      <div class="glossary-item">
        <div class="term">Alpha 因子</div>
        <div class="def">参照Qlib Alpha158标准的40+个量化因子，包括K-Bar形态、价格动量、均线偏离、波动率、成交量、技术衍生等六大类。通过ICIR引擎计算权重，与策略信号融合评分。</div>
      </div>
      <div class="glossary-item">
        <div class="term">信号窗口 (Signal Window)</div>
        <div class="def">判断策略是否"最近触发"的时间窗口，默认15天。如果策略在最近15天内触发过信号，就计入该股票的评分。窗口越小信号越新鲜。</div>
      </div>
      <div class="glossary-item">
        <div class="term">融合评分</div>
        <div class="def">最终评分 = 策略信号加权分 × 65% + Alpha因子加权分 × 35%。两个维度互相补充：策略信号捕捉技术形态，Alpha因子捕捉统计规律。</div>
      </div>
    </div>
  `;

  renderStrategies();
}

// 启动
loadData().then(data => {
  if (data) renderPage(data);
  else {
    document.getElementById('loading').innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div>数据加载失败，请检查网络</div></div>';
  }
});
</script>
</body>
</html>
