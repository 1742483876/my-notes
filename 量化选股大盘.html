<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>量化选股大盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;
  --red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657;
  --card-radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:16px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,#58a6ff,#bc8cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{font-size:13px;color:var(--text2);margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.update-time{font-size:12px;color:var(--text2);background:var(--surface2);padding:6px 12px;border-radius:20px;border:1px solid var(--border)}
.refresh-btn{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.refresh-btn:hover{opacity:.85}
.tabs{display:flex;gap:4px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:14px 20px;cursor:pointer;font-size:14px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.page{display:none;padding:24px 32px;max-width:1400px;margin:0 auto}
.page.active{display:block}
/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--accent))}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:var(--accent-color,var(--accent))}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px}
/* 推荐列表 */
.section-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-weight:500}
.recommend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:28px}
.stock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.stock-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,166,255,.15)}
.stock-card-rank{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.rank-1{background:linear-gradient(135deg,#ffd700,#ffa500);color:#000}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#000}
.rank-3{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff}
.rank-other{background:var(--surface2);color:var(--text2)}
.stock-name{font-size:16px;font-weight:600;margin-bottom:2px}
.stock-code{font-size:12px;color:var(--text2)}
.stock-score-bar{margin:12px 0 8px;background:var(--surface2);border-radius:4px;height:6px;overflow:hidden}
.stock-score-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .6s}
.stock-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stock-score-num{font-size:20px;font-weight:700;color:var(--accent)}
.stock-price-info{text-align:right}
.stock-price{font-size:15px;font-weight:600}
.stock-chg{font-size:12px;margin-top:2px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--text2)}
.strategy-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.stag{font-size:11px;background:rgba(88,166,255,.12);color:var(--accent);padding:2px 7px;border-radius:4px;border:1px solid rgba(88,166,255,.2)}
.hit-count{font-size:12px;color:var(--text2);margin-top:6px}
/* 策略表格 */
.strategy-table{width:100%;border-collapse:collapse;font-size:13px}
.strategy-table th{text-align:left;padding:10px 14px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.strategy-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.strategy-table tr:hover td{background:rgba(255,255,255,.02)}
.strategy-table tr:last-child td{border-bottom:none}
.progress-bar{background:var(--surface2);border-radius:3px;height:5px;overflow:hidden;min-width:80px}
.progress-fill{height:100%;border-radius:3px;transition:width .6s}
.win-fill{background:var(--green)}
.weight-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(188,140,255,.15);color:var(--purple);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.pos{color:var(--red)}.neg{color:var(--green)}
/* 图表容器 */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:20px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text2)}
.chart-wrap{position:relative;height:240px}
.chart-wrap-tall{position:relative;height:320px}
/* 空态 */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px}
/* loading */
.loading{display:flex;align-items:center;justify-content:center;padding:80px;flex-direction:column;gap:16px;color:var(--text2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-progress{width:260px;background:var(--surface2);border-radius:6px;height:6px;overflow:hidden;margin-top:4px}
.loading-progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .4s ease}
.loading-step{font-size:13px;color:var(--text2);margin-top:2px;min-height:20px;text-align:center}
/* 响应式 */
@media(max-width:768px){
  .page{padding:16px}
  .chart-grid{grid-template-columns:1fr}
  .header{padding:16px}
  .tabs{padding:0 16px}
  .recommend-grid{grid-template-columns:1fr}
}
.table-wrap{overflow-x:auto;border-radius:var(--card-radius);border:1px solid var(--border)}
/* tooltip */
.tooltip{position:relative;cursor:help}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1c2128;border:1px solid var(--border);color:var(--text);font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:99;pointer-events:none}
/* 顶部推荐条 */
.top-banner{background:linear-gradient(135deg,rgba(88,166,255,.1),rgba(188,140,255,.1));border:1px solid rgba(88,166,255,.2);border-radius:var(--card-radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-banner-icon{font-size:24px}
.top-banner-text{flex:1}
.top-banner-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.top-banner-stocks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.top-stock-pill{background:rgba(88,166,255,.15);color:var(--accent);padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid rgba(88,166,255,.25)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">📈</div>
    <div>
      <h1>量化选股大盘</h1>
      <div class="header-meta" id="headerMeta">加载中...</div>
    </div>
  </div>
  <div class="header-right">
    <div class="update-time" id="updateTime">--</div>
    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('today')">🎯 今日推荐</div>
  <div class="tab" onclick="switchTab('backtest')">📊 策略回测</div>
  <div class="tab" onclick="switchTab('equity')">📈 权益曲线</div>
  <div class="tab" onclick="switchTab('weights')">⚖️ 权重分析</div>
</div>

<!-- 今日推荐 -->
<div class="page active" id="page-today">
  <div id="loadingToday" class="loading">
    <div class="spinner"></div>
    <span id="loadingText">正在连接数据...</span>
    <div class="loading-progress"><div class="loading-progress-fill" id="loadingBar" style="width:0%"></div></div>
    <div class="loading-step" id="loadingStep"></div>
  </div>
  <div id="contentToday" style="display:none">
    <div class="stat-grid" id="statGrid"></div>
    <div class="top-banner" id="topBanner"></div>
    <div class="section-title">🏆 今日推荐股票 <span class="badge" id="recBadge">0</span></div>
    <div class="recommend-grid" id="recommendGrid"></div>
  </div>
</div>

<!-- 策略回测 -->
<div class="page" id="page-backtest">
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">📊 各策略胜率对比（30日回测）</div>
      <div class="chart-wrap"><canvas id="chartWinRate"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">💰 各策略平均收益对比（30日回测）</div>
      <div class="chart-wrap"><canvas id="chartAvgReturn"></canvas></div>
    </div>
  </div>
  <div class="section-title">📋 策略详情表</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap" id="periodBtns">
    <button onclick="switchPeriod('30d')" class="period-btn active" data-p="30d">30日回测</button>
    <button onclick="switchPeriod('1y')" class="period-btn" data-p="1y">1年回测</button>
    <button onclick="switchPeriod('all')" class="period-btn" data-p="all">全量回测</button>
  </div>
  <div class="table-wrap">
    <table class="strategy-table" id="strategyTable">
      <thead>
        <tr>
          <th>策略名称</th>
          <th>描述</th>
          <th>权重</th>
          <th>胜率</th>
          <th>平均收益</th>
          <th>累计收益</th>
          <th>Sharpe</th>
          <th>交易次数</th>
        </tr>
      </thead>
      <tbody id="strategyTbody"></tbody>
    </table>
  </div>
</div>

<!-- 权益曲线 -->
<div class="page" id="page-equity">
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">📈 组合权益曲线（近30日）</div>
      <div class="chart-wrap-tall"><canvas id="chartEquity30"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">📈 组合权益曲线（近1年）</div>
      <div class="chart-wrap-tall"><canvas id="chartEquity1y"></canvas></div>
    </div>
  </div>
  <div class="chart-card" style="margin-top:0">
    <div class="chart-title">🎯 各策略综合评分雷达图（30日）</div>
    <div style="max-width:500px;margin:0 auto;height:360px"><canvas id="chartRadar"></canvas></div>
  </div>
</div>

<!-- 权重分析 -->
<div class="page" id="page-weights">
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">⚖️ 策略权重分布</div>
      <div class="chart-wrap"><canvas id="chartWeights"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">📊 策略命中频次（今日）</div>
      <div class="chart-wrap"><canvas id="chartHitFreq"></canvas></div>
    </div>
  </div>
  <div class="section-title">🔬 策略权重说明</div>
  <div id="weightCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"></div>
</div>

<script>
let G = null; // 全局数据
let charts = {};
let currentPeriod = '30d';

// ===== 进度提示 =====
function setProgress(pct, text, step = '') {
  const bar = document.getElementById('loadingBar');
  const txt = document.getElementById('loadingText');
  const stp = document.getElementById('loadingStep');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = text;
  if (stp) stp.textContent = step;
}

// ===== 数据加载 =====
async function loadData() {
  const loading = document.getElementById('loadingToday');
  const content = document.getElementById('contentToday');
  loading.style.display = 'flex';
  content.style.display = 'none';

  try {
    // Step 1: 连接数据
    setProgress(10, '正在读取量化数据...', '📡 连接本地数据源');
    await new Promise(r => setTimeout(r, 50)); // 让UI刷新

    const fetchWithTimeout = (url, ms = 5000) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      return fetch(url, { signal: controller.signal })
        .finally(() => clearTimeout(timer));
    };

    const paths = [
      './data/api/quant_dashboard.json',
      'data/api/quant_dashboard.json',
    ];

    let data = null;
    for (const p of paths) {
      try {
        setProgress(25, '正在读取量化数据...', `📂 加载 ${p}`);
        const r = await fetchWithTimeout(p + '?t=' + Date.now());
        if (r.ok) {
          setProgress(45, '正在解析数据...', '🔍 解析 JSON 结构');
          await new Promise(r => setTimeout(r, 30));
          data = await r.json();
          break;
        }
      } catch(e) {}
    }

    if (!data) {
      setProgress(50, '使用演示数据...', '⚠️ 未找到本地数据，加载演示模式');
      await new Promise(r => setTimeout(r, 200));
      data = generateDemoData();
    }

    // Step 2: 解析策略
    setProgress(60, '解析策略权重...', `📊 共 ${data.strategies?.length || 0} 个策略`);
    await new Promise(r => setTimeout(r, 30));

    G = data;

    // Step 3: 渲染推荐
    setProgress(75, '渲染今日推荐...', `🏆 计算 ${data.recommendations?.length || 0} 只候选股票`);
    await new Promise(r => setTimeout(r, 30));

    renderAll();

    // Step 4: 完成
    setProgress(100, '加载完成！', `✅ 数据更新于 ${data.generated_at ? data.generated_at.slice(0,16) : '未知时间'}`);
    await new Promise(r => setTimeout(r, 300));

    loading.style.display = 'none';
    content.style.display = 'block';
  } catch(e) {
    loading.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div>加载失败：${e.message}</div><div style="margin-top:12px;font-size:12px">请先运行 python3 quant_engine.py 生成数据</div></div>`;
  }
}

// ===== 演示数据 =====
function generateDemoData() {
  const strats = [
    {id:'maGoldenCross',name:'均线金叉',desc:'MA5上穿MA20，短期趋势转强信号'},
    {id:'volumeBreakout',name:'放量突破',desc:'价格突破20日高点且成交量放大1.5倍'},
    {id:'rsiOversold',name:'RSI超卖',desc:'RSI从超卖区（<30）回升，反弹信号'},
    {id:'oversoldBounce',name:'超跌反弹',desc:'10日跌幅超15%后出现3%以上反弹'},
    {id:'bollingerMeanReversion',name:'布林回归',desc:'价格触及布林下轨，均值回归机会'},
    {id:'kdjGoldenCross',name:'KDJ金叉',desc:'KDJ的J值从低位金叉，底部反转'},
    {id:'supermarket',name:'超市战法',desc:'低价股+温和放量+均线上方，稳健选股'},
    {id:'coldStock',name:'冷门股',desc:'价格处于120日历史低位区间（底部20%）'},
    {id:'bottomFishing76',name:'76%抄底',desc:'5日大跌+RSI极低+下影线长，抄底形态'},
    {id:'equalWeight',name:'等权指数',desc:'20日动量为正时定期轮动买入'},
    {id:'permanentPortfolio',name:'永久组合',desc:'60日定期再平衡，长期持有策略'},
    {id:'mainForceDivergence',name:'主力分歧',desc:'价量波动率低且上涨，主力悄悄建仓'},
    {id:'mainForceDivRate',name:'主力分歧率',desc:'主力分歧率快速收窄且上涨，加速吸筹'},
    {id:'consecutiveYangLine',name:'连续阳线',desc:'连续3根阳线，短期多头强势'},
    {id:'volumeNewHigh',name:'成交额新高',desc:'成交额创60日新高且收涨，资金大幅流入'},
  ];

  const weights = {};
  const wArr = [0.12,0.11,0.09,0.08,0.08,0.07,0.07,0.06,0.06,0.05,0.05,0.05,0.05,0.04,0.03];
  strats.forEach((s,i) => weights[s.id] = wArr[i]);

  const bt30 = {}; const bt1y = {}; const btall = {};
  strats.forEach(s => {
    bt30[s.id]  = {win_rate:45+Math.random()*25,avg_return:-0.5+Math.random()*2.5,total_return:-5+Math.random()*30,total_trades:Math.floor(50+Math.random()*200),signal_stocks:Math.floor(20+Math.random()*80),sharpe:-0.5+Math.random()*2};
    bt1y[s.id]  = {win_rate:43+Math.random()*22,avg_return:-0.3+Math.random()*2.2,total_return:-10+Math.random()*60,total_trades:Math.floor(200+Math.random()*800),signal_stocks:Math.floor(100+Math.random()*300),sharpe:-0.3+Math.random()*1.8};
    btall[s.id] = {win_rate:42+Math.random()*20,avg_return:-0.2+Math.random()*2,total_return:-20+Math.random()*120,total_trades:Math.floor(500+Math.random()*2000),signal_stocks:Math.floor(200+Math.random()*600),sharpe:-0.2+Math.random()*1.5};
  });

  const strategyList = strats.map(s => ({...s, weight:weights[s.id], backtest_30d:bt30[s.id], backtest_1y:bt1y[s.id], backtest_all:btall[s.id]}));
  strategyList.sort((a,b) => b.weight - a.weight);

  const stocks = ['贵州茅台','宁德时代','比亚迪','中国平安','招商银行','隆基绿能','迈瑞医疗','三一重工','万科A','格力电器','美的集团','海天味业','恒瑞医药','药明康德','东方财富','中信证券','华泰证券','中芯国际','立讯精密','歌尔股份'];
  const codes = ['600519','300750','002594','601318','600036','601012','300760','600031','000002','000651','000333','603288','600276','603259','300059','600030','601688','688981','002475','002241'];

  const recommendations = stocks.slice(0,15).map((name,i) => {
    const hitStrats = strats.slice(0, 2+Math.floor(Math.random()*5)).map(s=>s.name);
    return {code:codes[i],name,score:30+Math.random()*55,hit_count:hitStrats.length,strategies:hitStrats,reason_text:hitStrats.join(' + '),close:10+Math.random()*200,chg_1d:-3+Math.random()*6,chg_5d:-5+Math.random()*10,last_date:'2026-03-18'};
  });
  recommendations.sort((a,b) => b.score - a.score);

  // 权益曲线
  const equity30 = []; let eq = 100;
  for(let i=30;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    eq *= (1 + (-0.3+Math.random()*0.7)/100);
    equity30.push({date:d.toISOString().slice(0,10),equity:parseFloat(eq.toFixed(2))});
  }
  const equity1y = []; eq = 100;
  for(let i=365;i>=0;i-=2){
    const d = new Date(); d.setDate(d.getDate()-i);
    eq *= (1 + (-0.4+Math.random()*0.8)/100);
    equity1y.push({date:d.toISOString().slice(0,10),equity:parseFloat(eq.toFixed(2))});
  }

  return {
    date: new Date().toISOString().slice(0,10),
    update_time: new Date().toISOString(),
    stock_count: 5012,
    strategy_count: 15,
    weights, strategy_list: strategyList,
    recommendations, recommend_count: recommendations.length,
    equity_30d: equity30, equity_1y: equity1y,
    backtest_30d: bt30, backtest_1y: bt1y, backtest_all: btall,
    _demo: true
  };
}

// ===== 渲染全部 =====
function renderAll() {
  if (!G) return;
  document.getElementById('updateTime').textContent = '更新: ' + (G.update_time || G.date || '--').slice(0,16).replace('T',' ');
  document.getElementById('headerMeta').textContent = `${G.stock_count?.toLocaleString() || '--'} 只股票 · ${G.strategy_count || 15} 个策略${G._demo ? ' · 演示数据' : ''}`;

  renderStats();
  renderTopBanner();
  renderRecommend();
  renderBacktestCharts();
  renderStrategyTable();
  renderEquityCharts();
  renderWeightCharts();
  renderWeightCards();
}

function renderStats() {
  const recs = G.recommendations || [];
  const top1 = recs[0] || {};
  const avgScore = recs.length ? (recs.reduce((s,r)=>s+r.score,0)/recs.length).toFixed(1) : 0;
  const bt30 = G.backtest_30d || {};
  const avgWin = Object.values(bt30).length ? (Object.values(bt30).reduce((s,v)=>s+(v.win_rate||0),0)/Object.values(bt30).length).toFixed(1) : '--';

  const stats = [
    {label:'今日推荐数量',value:recs.length,sub:'命中策略股票',color:'var(--accent)'},
    {label:'最高评分',value:top1.score?.toFixed(1)||'--',sub:top1.name||'--',color:'var(--yellow)'},
    {label:'平均评分',value:avgScore,sub:'推荐股票均值',color:'var(--purple)'},
    {label:'策略平均胜率',value:avgWin+'%',sub:'30日回测',color:'var(--green)'},
    {label:'扫描股票数',value:(G.stock_count||0).toLocaleString(),sub:'A股全市场',color:'var(--orange)'},
    {label:'策略数量',value:G.strategy_count||15,sub:'多策略加权',color:'var(--accent)'},
  ];
  document.getElementById('statGrid').innerHTML = stats.map(s => `
    <div class="stat-card" style="--accent-color:${s.color}">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-sub">${s.sub}</div>
    </div>`).join('');
}

function renderTopBanner() {
  const recs = (G.recommendations || []).slice(0, 5);
  document.getElementById('topBanner').innerHTML = `
    <div class="top-banner-icon">🔥</div>
    <div class="top-banner-text">
      <div class="top-banner-title">今日 Top5 推荐（${G.date || '--'}）</div>
      <div style="font-size:12px;color:var(--text2)">基于 ${G.strategy_count||15} 个量化策略加权评分，数据仅供参考，不构成投资建议</div>
      <div class="top-banner-stocks">
        ${recs.map(r => `<span class="top-stock-pill">${r.name} <span style="opacity:.7">${r.score.toFixed(0)}分</span></span>`).join('')}
      </div>
    </div>`;
}

function renderRecommend() {
  const recs = G.recommendations || [];
  document.getElementById('recBadge').textContent = recs.length;
  if (!recs.length) {
    document.getElementById('recommendGrid').innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>暂无推荐数据</div></div>';
    return;
  }
  document.getElementById('recommendGrid').innerHTML = recs.map((r, i) => {
    const rankClass = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';
    const chgClass = r.chg_1d > 0 ? 'up' : r.chg_1d < 0 ? 'down' : 'flat';
    const chgSign = r.chg_1d > 0 ? '+' : '';
    const scoreW = Math.min(r.score, 100);
    return `
    <div class="stock-card">
      <div class="stock-card-rank ${rankClass}">${i+1}</div>
      <div class="stock-name">${r.name}</div>
      <div class="stock-code">${r.code} · ${r.last_date || '--'}</div>
      <div class="stock-meta">
        <div>
          <div class="stock-score-num">${r.score.toFixed(1)}<span style="font-size:13px;color:var(--text2);font-weight:400"> 分</span></div>
          <div class="hit-count">命中 ${r.hit_count} 个策略</div>
        </div>
        <div class="stock-price-info">
          <div class="stock-price">¥${r.close?.toFixed(2)||'--'}</div>
          <div class="stock-chg ${chgClass}">${chgSign}${r.chg_1d?.toFixed(2)||'--'}%</div>
        </div>
      </div>
      <div class="stock-score-bar"><div class="stock-score-fill" style="width:${scoreW}%"></div></div>
      <div class="strategy-tags">${(r.strategies||[]).map(s=>`<span class="stag">${s}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

// ===== 回测图表 =====
function renderBacktestCharts() {
  const bt = G.backtest_30d || {};
  const sl = G.strategy_list || [];
  const names = sl.map(s => s.name);
  const ids   = sl.map(s => s.id);
  const winRates   = ids.map(id => bt[id]?.win_rate || 0);
  const avgReturns = ids.map(id => bt[id]?.avg_return || 0);

  destroyChart('chartWinRate');
  charts.winRate = new Chart(document.getElementById('chartWinRate'), {
    type: 'bar',
    data: {
      labels: names,
      datasets: [{
        label: '胜率 %',
        data: winRates,
        backgroundColor: winRates.map(v => v >= 50 ? 'rgba(63,185,80,.7)' : 'rgba(248,81,73,.7)'),
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, min: 0, max: 100,
             title: { display: true, text: '胜率 %', color: '#8b949e' } }
      }
    }
  });

  destroyChart('chartAvgReturn');
  charts.avgReturn = new Chart(document.getElementById('chartAvgReturn'), {
    type: 'bar',
    data: {
      labels: names,
      datasets: [{
        label: '平均收益 %',
        data: avgReturns,
        backgroundColor: avgReturns.map(v => v >= 0 ? 'rgba(63,185,80,.7)' : 'rgba(248,81,73,.7)'),
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' },
             title: { display: true, text: '平均收益 %', color: '#8b949e' } }
      }
    }
  });
}

function renderStrategyTable() {
  const sl = G.strategy_list || [];
  const periodKey = currentPeriod === '30d' ? 'backtest_30d' : currentPeriod === '1y' ? 'backtest_1y' : 'backtest_all';
  document.getElementById('strategyTbody').innerHTML = sl.map(s => {
    const bt = s[periodKey] || {};
    const wr = bt.win_rate || 0;
    const ar = bt.avg_return || 0;
    const tr = bt.total_return || 0;
    const sh = bt.sharpe || 0;
    return `
    <tr>
      <td><b>${s.name}</b></td>
      <td style="color:var(--text2);font-size:12px;max-width:200px">${s.desc||''}</td>
      <td><span class="weight-badge">⚖️ ${((s.weight||0)*100).toFixed(1)}%</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="progress-bar"><div class="progress-fill win-fill" style="width:${wr}%"></div></div>
          <span style="font-size:12px;min-width:36px">${wr.toFixed(1)}%</span>
        </div>
      </td>
      <td class="${ar>=0?'pos':'neg'}">${ar>=0?'+':''}${ar.toFixed(2)}%</td>
      <td class="${tr>=0?'pos':'neg'}">${tr>=0?'+':''}${tr.toFixed(1)}%</td>
      <td style="color:${sh>=1?'var(--green)':sh>=0?'var(--yellow)':'var(--red)'}">${sh.toFixed(2)}</td>
      <td style="color:var(--text2)">${(bt.total_trades||0).toLocaleString()}</td>
    </tr>`;
  }).join('');
}

function switchPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  renderStrategyTable();
}

// ===== 权益曲线 =====
function renderEquityCharts() {
  const e30 = G.equity_30d || [];
  const e1y = G.equity_1y  || [];

  destroyChart('chartEquity30');
  if (e30.length) {
    charts.eq30 = new Chart(document.getElementById('chartEquity30'), {
      type: 'line',
      data: {
        labels: e30.map(d => d.date),
        datasets: [{
          label: '组合净值',
          data: e30.map(d => d.equity),
          borderColor: '#58a6ff',
          backgroundColor: 'rgba(88,166,255,.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 2,
        }]
      },
      options: chartLineOptions('净值')
    });
  }

  destroyChart('chartEquity1y');
  if (e1y.length) {
    charts.eq1y = new Chart(document.getElementById('chartEquity1y'), {
      type: 'line',
      data: {
        labels: e1y.map(d => d.date),
        datasets: [{
          label: '组合净值',
          data: e1y.map(d => d.equity),
          borderColor: '#bc8cff',
          backgroundColor: 'rgba(188,140,255,.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 2,
        }]
      },
      options: chartLineOptions('净值')
    });
  }

  // 雷达图
  const bt30 = G.backtest_30d || {};
  const sl = (G.strategy_list || []).slice(0, 8);
  destroyChart('chartRadar');
  charts.radar = new Chart(document.getElementById('chartRadar'), {
    type: 'radar',
    data: {
      labels: sl.map(s => s.name),
      datasets: [
        {
          label: '胜率(归一)',
          data: sl.map(s => (bt30[s.id]?.win_rate||0)/100),
          borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,.15)',
          borderWidth: 2, pointRadius: 3,
        },
        {
          label: '收益(归一)',
          data: sl.map(s => Math.max(0, Math.min(1, (bt30[s.id]?.avg_return||0)/3))),
          borderColor: '#3fb950', backgroundColor: 'rgba(63,185,80,.15)',
          borderWidth: 2, pointRadius: 3,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8b949e', font: { size: 12 } } } },
      scales: {
        r: {
          ticks: { color: '#8b949e', backdropColor: 'transparent', font: { size: 10 } },
          grid: { color: '#30363d' },
          pointLabels: { color: '#e6edf3', font: { size: 11 } },
          min: 0, max: 1
        }
      }
    }
  });
}

function chartLineOptions(yLabel) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1c2128', titleColor: '#e6edf3', bodyColor: '#8b949e', borderColor: '#30363d', borderWidth: 1 } },
    scales: {
      x: { ticks: { color: '#8b949e', maxTicksLimit: 8, font: { size: 11 } }, grid: { color: '#21262d' } },
      y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, title: { display: true, text: yLabel, color: '#8b949e' } }
    }
  };
}

// ===== 权重分析 =====
function renderWeightCharts() {
  const w = G.weights || {};
  const sl = G.strategy_list || [];
  const names = sl.map(s => s.name);
  const wVals = sl.map(s => ((s.weight||0)*100).toFixed(1));

  const colors = ['#58a6ff','#bc8cff','#3fb950','#ffa657','#f85149','#d29922','#79c0ff','#56d364','#ffb3ba','#c3e88d','#82aaff','#ff9d00','#89ddff','#f07178','#c792ea'];

  destroyChart('chartWeights');
  charts.weights = new Chart(document.getElementById('chartWeights'), {
    type: 'doughnut',
    data: { labels: names, datasets: [{ data: wVals, backgroundColor: colors, borderColor: '#161b22', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#8b949e', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { backgroundColor: '#1c2128', titleColor: '#e6edf3', bodyColor: '#8b949e', borderColor: '#30363d', borderWidth: 1 }
      }
    }
  });

  // 命中频次
  const recs = G.recommendations || [];
  const freq = {};
  recs.forEach(r => (r.strategies||[]).forEach(s => freq[s] = (freq[s]||0)+1));
  const freqSorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);

  destroyChart('chartHitFreq');
  charts.hitFreq = new Chart(document.getElementById('chartHitFreq'), {
    type: 'bar',
    data: {
      labels: freqSorted.map(f=>f[0]),
      datasets: [{ label:'命中次数', data: freqSorted.map(f=>f[1]), backgroundColor: 'rgba(88,166,255,.7)', borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#e6edf3', font: { size: 12 } }, grid: { color: '#21262d' } }
      }
    }
  });
}

function renderWeightCards() {
  const sl = G.strategy_list || [];
  const bt30 = G.backtest_30d || {};
  document.getElementById('weightCards').innerHTML = sl.map((s,i) => {
    const bt = bt30[s.id] || {};
    const w = ((s.weight||0)*100).toFixed(1);
    const wr = bt.win_rate?.toFixed(1) || '--';
    const ar = bt.avg_return?.toFixed(2) || '--';
    const sh = bt.sharpe?.toFixed(2) || '--';
    return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="font-size:14px">${s.name}</b>
        <span class="weight-badge">⚖️ ${w}%</span>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5">${s.desc||''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px">
        <div style="text-align:center"><div style="color:var(--text2)">胜率</div><div style="color:${parseFloat(wr)>=50?'var(--green)':'var(--red)';font-weight:600}">${wr}%</div></div>
        <div style="text-align:center"><div style="color:var(--text2)">均收益</div><div style="color:${parseFloat(ar)>=0?'var(--red)':'var(--green)';font-weight:600}">${parseFloat(ar)>=0?'+':''}${ar}%</div></div>
        <div style="text-align:center"><div style="color:var(--text2)">Sharpe</div><div style="font-weight:600">${sh}</div></div>
      </div>
    </div>`;
  }).join('');
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

// ===== Tab 切换 =====
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['today','backtest','equity','weights'];
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name)?.classList.add('active');
  // 延迟渲染图表（避免隐藏时尺寸为0）
  if (G) {
    setTimeout(() => {
      if (name === 'backtest') renderBacktestCharts();
      if (name === 'equity')   renderEquityCharts();
      if (name === 'weights')  renderWeightCharts();
    }, 50);
  }
}

// period 按钮样式
document.querySelectorAll('.period-btn').forEach(b => {
  b.style.cssText = 'background:var(--surface2);color:var(--text2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:.2s';
  b.addEventListener('mouseover', () => { if(!b.classList.contains('active')) b.style.color='var(--text)' });
  b.addEventListener('mouseout', () => { if(!b.classList.contains('active')) b.style.color='var(--text2)' });
});
function updatePeriodBtnStyle() {
  document.querySelectorAll('.period-btn').forEach(b => {
    b.style.background = b.classList.contains('active') ? 'var(--accent)' : 'var(--surface2)';
    b.style.color = b.classList.contains('active') ? '#fff' : 'var(--text2)';
    b.style.borderColor = b.classList.contains('active') ? 'var(--accent)' : 'var(--border)';
  });
}
const origSwitch = switchPeriod;
window.switchPeriod = function(p) { origSwitch(p); updatePeriodBtnStyle(); };

// 初始化
loadData();
</script>
</body>
</html>
